[package]
name = "playit-operator"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "A Kubernetes operator that reconciles PlayitTunnel resources into playit.gg tunnels."
repository = "https://github.com/ErikAndreasKlokk/playit-operator"
readme = "README.md"
keywords = ["kubernetes", "operator", "playit", "tunnel", "kube"]
categories = ["network-programming"]

[lib]
name = "playit_operator"
path = "src/lib.rs"

[[bin]]
name = "playit-operator"
path = "src/main.rs"

[[bin]]
name = "crdgen"
path = "src/bin/crdgen.rs"

[dependencies]
kube = { version = "0.99.0", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.24.0", features = ["latest"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "0.8"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
