name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test
      - name: CRD manifest is up to date
        run: |
          cargo run --bin crdgen > /tmp/crd.yaml
          diff -u deploy/crd.yaml /tmp/crd.yaml \
            || (echo "::error::deploy/crd.yaml is stale — run 'cargo run --bin crdgen > deploy/crd.yaml'" && exit 1)
