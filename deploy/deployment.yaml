apiVersion: apps/v1
kind: Deployment
metadata:
  name: playit-operator
  namespace: playit-operator-system
  labels:
    app: playit-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playit-operator
  template:
    metadata:
      labels:
        app: playit-operator
    spec:
      serviceAccountName: playit-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/erikandreasklokk/playit-operator:main
          imagePullPolicy: Always
          env:
            # dry-run (default) logs intended API calls without touching playit.
            # Set to "playit" and provide a credential below to use the real API.
            - name: PLAYIT_PROVIDER
              value: "dry-run"
            # The credential: a SELF-MANAGED agent's secret key. A self-managed
            # agent can create/modify its own tunnels via the playit V1 API.
            # (An assignable agent is read-only and cannot create tunnels.)
            # - name: PLAYIT_AGENT_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: playit-operator-credentials
            #       key: agent-key
            # PLAYIT_API_KEY still exists but is a dead path — playit cancelled
            # account API keys (abuse). Don't rely on it.
            - name: RUST_LOG
              value: "info"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
