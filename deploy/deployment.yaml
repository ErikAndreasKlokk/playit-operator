apiVersion: apps/v1
kind: Deployment
metadata:
  name: playit-operator
  namespace: playit-operator-system
  labels:
    app: playit-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playit-operator
  template:
    metadata:
      labels:
        app: playit-operator
    spec:
      serviceAccountName: playit-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/erikandreasklokk/playit-operator:main
          imagePullPolicy: Always
          env:
            # dry-run (default) logs intended API calls without touching playit.
            # Set to "playit" and provide a credential below to use the real API.
            - name: PLAYIT_PROVIDER
              value: "dry-run"
            # Preferred: a write-capable account API key (create/update/delete).
            # - name: PLAYIT_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: playit-operator-credentials
            #       key: api-key
            # Fallback: an agent secret key. READ-ONLY — good for listing, but
            # playit rejects tunnel creation/updates with it. Same value as the
            # agent's SECRET_KEY.
            # - name: PLAYIT_AGENT_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: playit-operator-credentials
            #       key: agent-key
            - name: RUST_LOG
              value: "info"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
