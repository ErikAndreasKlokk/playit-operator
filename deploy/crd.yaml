# Authoritative source is the Rust types in src/crd.rs.
# Regenerate with:  cargo run --bin crdgen > deploy/crd.yaml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: playittunnels.playit-operator.io
spec:
  group: playit-operator.io
  scope: Namespaced
  names:
    kind: PlayitTunnel
    listKind: PlayitTunnelList
    plural: playittunnels
    singular: playittunnel
    shortNames:
      - ptun
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Protocol
          type: string
          jsonPath: .spec.protocol
        - name: Service
          type: string
          jsonPath: .spec.serviceName
        - name: Address
          type: string
          jsonPath: .status.address
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [serviceName, port]
              properties:
                protocol:
                  type: string
                  enum: [tcp, udp, both]
                  default: tcp
                serviceName:
                  type: string
                  description: Name of the target Service in the same namespace.
                port:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  description: Port on the target Service to forward to.
                portCount:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 1
                  description: Number of consecutive ports to allocate.
                region:
                  type: string
                  description: Optional playit region id.
                customDomain:
                  type: string
                  description: >-
                    Custom domain to attach (requires playit Premium). Reserved;
                    not yet implemented.
            status:
              type: object
              properties:
                phase:
                  type: string
                tunnelId:
                  type: string
                address:
                  type: string
                customDomainReady:
                  type: boolean
                observedGeneration:
                  type: integer
                  format: int64
                message:
                  type: string
